<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HRS">
  <!-- Ícone da aba: monograma nas cores do timbrado (azul institucional e a
       regra dourada). A arte oficial da marca não vira favicon porque é
       horizontal e ficaria ilegível em 16 px. -->
  <defs>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f9e08a"/>
      <stop offset="50%" stop-color="#f4ce57"/>
      <stop offset="100%" stop-color="#c08a1b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="10" fill="#3858ab"/>
  <text x="32" y="36" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="25" font-weight="700" letter-spacing="0.5" fill="#ffffff">HRS</text>
  <rect x="14" y="44" width="36" height="3.5" rx="1.75" fill="url(#ouro)"/>
</svg>
